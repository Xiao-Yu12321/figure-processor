margin-top:8px;color:#334b3e;font-size:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}output{float:right;color:#497e55}input[type=range]{display:block;width:100%;margin:12px 0 6px;accent-color:#447a50}label small{display:block;font-weight:400;line-height:1.6}.checkbox{display:flex;align-items:center;gap:7px;font-weight:400}.checkbox small{margin-left:auto}input[type=checkbox]{accent-color:#447a50}.primary,.download{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;border-radius:8px;padding:14px 18px;text-decoration:none;font-size:13px;font-weight:650}.primary{margin-top:24px;background:#397754;color:white}.primary:disabled{opacity:.45;cursor:default}.primary:hover:enabled{background:#28633f}.download{background:#edf3e9;color:#397754}.download.disabled{opacity:.45;pointer-events:none}.preview-switch{display:flex;gap:4px}.preview-switch button{border:1px solid #dce5da;background:#fff;color:#758475;border-radius:5px;width:29px;height:27px;font-size:12px}.preview-switch button.active{border-color:#4c8157;background:#edf5e9;color:#356d43}.checker{background-color:#fff;background-image:linear-gradient(45deg,#edf0ea 25%,transparent 25%),linear-gradient(-45deg,#edf0ea 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#edf0ea 75%),linear-gradient(-45deg,transparent 75%,#edf0ea 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.preview.white{background:#fff;border:1px solid #edf0e9}.geometry{font-size:60px;line-height:1;color:#97ad9b}.preview p{font-size:12px}.preview small{padding:4px;background:#ffffffbd;border-radius:4px}aside{background:#f7faf5;border-radius:10px;padding:18px;margin-top:26px;font-size:12px}aside strong{font-size:12px}aside p{font-size:11px;margin:8px 0 0}#status{font-size:12px;line-height:1.6;margin-top:14px;color:#3c7d59}#status.error{color:#ad462e}footer{display:flex;justify-content:space-between;padding:26px 0;color:#90a08f;font-size:10px}footer span{letter-spacing:1.5px}[hidden]{display:none!important}:focus-visible{outline:3px solid #8cbd94;outline-offset:3px}@media(max-width:760px){main{padding:20px}.workspace{grid-template-columns:1fr}.badge{display:none}.workflow{gap:16px;font-size:10px}.panel{padding:18px}.intro{padding-top:30px}.drop,.preview{height:280px}.checkbox{flex-wrap:wrap}.checkbox small{margin-left:0}footer span{display:none}}

<body>
<main>
  <div class="workspace">
    <section class="panel source-panel">
      <div class="panel-title"><h2>原始截图</h2><label id="choose" class="text-button native-upload">选择图片<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/bmp" aria-label="选择图片"></label></div>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="上传或拖入截图">
        <div id="placeholder"><div class="upload-icon">↥</div><h3>把几何截图放在这里</h3><p>点击上传、拖入图片，或直接 Ctrl / ⌘ + V 粘贴</p><small>PNG / JPG / WebP / BMP · 最大 20 MB</small></div>
        <div id="source-stage" class="image-stage" hidden><img id="original" alt="原始截图预览" draggable="false" hidden><div id="source-selection" class="selection-box" hidden></div></div>
      </div>
      <div class="crop-tools"><button id="source-select" type="button" aria-pressed="false" disabled>框选处理区域</button><button id="source-clear" type="button" disabled>取消选区</button><span id="source-crop-info" aria-live="polite"></span></div>
      <p id="source-info" class="caption" hidden></p>
      <div class="settings">
        <label>清晰化方式<select id="engine"><option value="basic">基础增强</option></select></label>
        <p id="engine-info" class="caption" aria-live="polite">离线基础版；线稿净化、AI 模型和 API 功能请启动 Python 后端使用。</p>
        <div id="line-settings" class="line-settings" hidden>
          <label>去灰阈值 <output id="line_threshold-value">170</output><input id="line_threshold" type="range" min="0" max="254" value="170"><small>调低去除更多灰色；浅色线条丢失时调高。</small></label>
          <label>边缘平滑 <output id="line_smooth-value">0.5</output><input id="line_smooth" type="range" min="0" max="2" step="0.1" value="0.5"><small>0 为关闭，建议 0.3–0.6；过高可能让细线变淡。</small></label>
          <label>线条颜色<input id="line_ink" type="color" value="#000000"></label>
        </div>
        <label data-general-control>背景处理<select id="background"><option value="uniform">去除全部同色背景</option><option value="keep">保留背景 · 仅清晰化</option></select></label>
        <div class="two-col"><label>放大倍数<select id="scale"><option value="1">1× 原尺寸</option><option value="2" selected>2× 更清晰</option><option value="3">3× 大图</option></select></label><label>透明边距<select id="padding"><option value="0">0 px</option><option value="8" selected>8 px</option><option value="16">16 px</option><option value="32">32 px</option></select></label></div>
        <label data-general-control>去背景容差 <output id="tolerance-value">24</output><input id="tolerance" type="range" min="0" max="100" value="24"><small>线条太淡或消失时调低；背景有残留时调高。</small></label>
        <label data-general-control>锐化强度 <output id="sharpen-value">100</output><input id="sharpen" type="range" min="0" max="200" value="100"></label>
        <label data-general-control class="checkbox"><input id="denoise" type="checkbox">轻度降噪 <small>细虚线或小字较多时建议关闭</small></label>
      </div>
      <button id="process" class="primary" disabled>处理图片 <span>→</span></button>
    </section>
    <section class="panel result-panel">
      <div class="panel-title"><h2>处理结果</h2><div class="preview-switch" role="group" aria-label="预览底色"><button data-bg="checker" class="active" aria-label="透明棋盘格">▦</button><button data-bg="white" aria-label="白色底">白</button></div></div>
      <div id="result-preview" class="preview checker"><div id="result-placeholder"><div class="geometry">△</div></div><div id="result-stage" class="image-stage" hidden><img id="result" alt="处理后的透明图片" draggable="false" hidden><div id="result-selection" class="selection-box" hidden></div></div></div>
      <div class="crop-tools"><button id="result-select" type="button" aria-pressed="false" disabled>框选保留区域</button><button id="result-apply" type="button" disabled>保留选区</button><button id="result-clear" type="button" disabled>取消选区</button><button id="result-reset" type="button" disabled>恢复完整结果</button><span id="result-crop-info" aria-live="polite"></span></div>
      <p id="result-info" class="caption" aria-live="polite">处理完成后，可切换底色检查线条和透明边缘。</p>
      <a id="download" class="download disabled" aria-disabled="true">下载透明 PNG <span>↓</span></a>
      <div id="status" role="status" aria-live="polite"></div>
    </section>
  </div>
  <footer><span>OUTPUT · TRANSPARENT PNG</span></footer>
</main>
<script>// Standalone browser processing. No server, network, or external libraries.
async function processLocalImage(form) {
  await new Promise(resolve => setTimeout(resolve, 30));
  const file = form.get('image');
  const scale = Number(form.get('scale'));
  const tolerance = Number(form.get('tolerance'));
  const padding = Number(form.get('padding'));
  const mode = form.get('background');
  const bitmap = await createImageBitmap(file, {imageOrientation: 'from-image'});
  const box = form.get('crop') ? JSON.parse(form.get('crop')) : [0, 0, bitmap.width, bitmap.height];
  if (!Array.isArray(box) || box.length !== 4 || !box.every(Number.isInteger) ||
      !(0 <= box[0] && box[0] < box[2] && box[2] <= bitmap.width &&
        0 <= box[1] && box[1] < box[3] && box[3] <= bitmap.height)) {
    bitmap.close(); throw new Error('选区不正确，请重新框选。');
  }
  const w = box[2]-box[0], h = box[3]-box[1], n = w * h;
  if (n > 6000000 || n * scale * scale > 24000000) {
    bitmap.close();
    throw new Error('本地版原图最多 600 万像素，放大后最多 2400 万像素，请缩小图片或降低倍数。');
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const context = canvas.getContext('2d', {willReadFrequently: true});
  context.drawImage(bitmap, box[0], box[1], w, h, 0, 0, w, h); bitmap.close();
  const image = context.getImageData(0, 0, w, h), pixels = image.data;
  let background = null;
  if (mode !== 'keep') {
    const border = [[], [], []];
    let total = 0;
    function sample(x, y) {
      total++;
      const i = (y * w + x) * 4;
      if (pixels[i + 3] > 242) for (let c = 0; c < 3; c++) border[c].push(pixels[i + c]);
    }
    for (let x = 0; x < w; x++) { sample(x, 0); sample(x, h - 1); }
    for (let y = 0; y < h; y++) { sample(0, y); sample(w - 1, y); }
    if (border[0].length > total / 2) {
      background = border.map(values => {values.sort((a,b) => a-b); return values[Math.floor(values.length / 2)];});
      const candidate = new Uint8Array(n), removed = new Uint8Array(n);
      for (let p = 0; p < n; p++) {
        const i = p * 4;
        const d = Math.max(...background.map((v, c) => Math.abs(pixels[i+c] - v)));
        candidate[p] = d <= tolerance || pixels[i+3] === 0 ? 1 : 0;
      }
      if (mode === 'uniform') removed.set(candidate);
      else {
        const queue = new Int32Array(n);
        let head = 0, tail = 0;
        function add(p) { if (candidate[p] && !removed[p]) {removed[p] = 1; queue[tail++] = p;} }
        for (let x = 0; x < w; x++) {add(x); add((h-1)*w+x);}
        for (let y = 0; y < h; y++) {add(y*w); add(y*w+w-1);}
        while (head < tail) {
          const p = queue[head++], x = p % w;
          if (x) add(p-1); if (x<w-1) add(p+1);
          if (p>=w) add(p-w); if (p<n-w) add(p+w);
        }
      }
      const lightPaper = Math.min(...background) >= 230;
      for (let p = 0; p < n; p++) {
        const i = p*4, x = p % w;
        if (removed[p]) {pixels[i+3]=0; continue;}
        const rim = (x && removed[p-1]) || (x<w-1 && removed[p+1]) || (p>=w && removed[p-w]) || (p<n-w && removed[p+w]);
        if ((lightPaper && mode === 'uniform') || rim) {
          let coverage;
          if (lightPaper) coverage = Math.max(0, Math.min(1, 1-Math.min(...background.map((v,c)=>pixels[i+c]/v))));
          else coverage = Math.max(0, Math.min(1, (Math.max(...background.map((v,c)=>Math.abs(pixels[i+c]-v)))-tolerance)/12));
          if (coverage>0 && coverage<1) for (let c=0; c<3; c++) pixels[i+c] = Math.max(0,Math.min(255,(pixels[i+c]-background[c]*(1-coverage))/coverage));
          pixels[i+3] = Math.round(pixels[i+3]*coverage);
        }
      }
    }
  }
  if (form.get('denoise') === 'true') {
    const source = pixels.slice();
    for (let y=1; y<h-1; y++) for (let x=1; x<w-1; x++) {
      const i=(y*w+x)*4;
      if (!source[i+3]) continue;
      // Filter only opaque interiors, so transparent boundaries stay crisp.
      let opaque = true;
      for (let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) if(source[((y+dy)*w+x+dx)*4+3] !== 255) opaque=false;
      if (!opaque) continue;
      for(let c=0;c<3;c++) {
        const values=[];
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) values.push(source[((y+dy)*w+x+dx)*4+c]);
        values.sort((a,b)=>a-b); pixels[i+c]=values[4];
      }
    }
  }
  let left=w, top=h, right=-1, bottom=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(pixels[(y*w+x)*4+3]) {
    left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y);
  }
  if (right<left) throw new Error('没有找到可保留的内容，请降低容差或选择保留背景。');
  context.putImageData(image,0,0);
  const output=document.createElement('canvas');
  const width=(right-left+1)*scale, height=(bottom-top+1)*scale;
  output.width=width+2*padding; output.height=height+2*padding;
  const out=output.getContext('2d',{willReadFrequently:true});
  out.imageSmoothingEnabled=true;out.imageSmoothingQuality='high';
  out.drawImage(canvas,left,top,right-left+1,bottom-top+1,padding,padding,width,height);
  const sharpen=Number(form.get('sharpen'))/100;
  if(sharpen>0) {
    const img=out.getImageData(0,0,output.width,output.height), source=img.data.slice(), target=img.data, ow=output.width;
    for(let y=1;y<output.height-1;y++) for(let x=1;x<ow-1;x++) {
      const i=(y*ow+x)*4;
      if(!source[i+3]) continue;
      // Alpha-weighted local blur avoids sharpening invisible background colors.
      for(let c=0;c<3;c++) {
        let sum=0, weight=0;
        for(const offset of [-ow,-1,0,1,ow]) {const j=i+offset*4;sum+=source[j+c]*source[j+3];weight+=source[j+3];}
        const blurred=weight?sum/weight:source[i+c];
        target[i+c]=Math.max(0,Math.min(255,source[i+c]+sharpen*(source[i+c]-blurred)));
      }
    }
    out.putImageData(img,0,0);
  }
  return {image:output.toDataURL('image/png'), original:[w,h],output:[output.width,output.height],background};
}

async function cropLocalImage(blob, box) {
  const image = await createImageBitmap(blob);
  try {
    const [left, top, right, bottom] = box;
    if (!(0 <= left && left < right && right <= image.width && 0 <= top && top < bottom && bottom <= image.height)) {
      throw new Error('选区超出图片范围，请重新框选。');
    }
    const canvas = document.createElement('canvas');
    canvas.width = right-left; canvas.height = bottom-top;
    canvas.getContext('2d').drawImage(image, left, top, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
    return {image: canvas.toDataURL('image/png'), output: [canvas.width, canvas.height]};
  } finally {image.close();}
}

// Selection coordinates refer to original image pixels, not preview pixels.
class RectangleSelection {
  constructor(stage, image, overlay, onChange) {
    this.stage = stage;
    this.image = image;
    this.overlay = overlay;
    this.onChange = onChange;
    this.box = null;
    this.active = false;
    this.pointer = null;
    stage.addEventListener('pointerdown', e => this.start(e));
    stage.addEventListener('pointermove', e => this.move(e));
    stage.addEventListener('pointerup', e => this.finish(e));
    stage.addEventListener('pointercancel', () => this.cancelDrag());
    image.addEventListener('load', () => this.draw());
    this.resize = new ResizeObserver(() => this.draw());
    this.resize.observe(image);
  }
  setActive(active) {
    this.active = active;
    this.stage.classList.toggle('selecting', active);
    if (!active) this.cancelDrag();
  }
  clear() {
    this.setActive(false);
    this.box = null;
    this.draw();
  }
  point(event) {
    const r = this.image.getBoundingClientRect();
    return [Math.max(0, Math.min(this.image.naturalWidth, (event.clientX-r.left) / r.width * this.image.naturalWidth)),
            Math.max(0, Math.min(this.image.naturalHeight, (event.clientY-r.top) / r.height * this.image.naturalHeight))];
  }
  start(event) {
    if (!this.active || event.button !== 0 || this.pointer !== null || !this.image.naturalWidth) return;
    const r = this.image.getBoundingClientRect();
    if (event.clientX < r.left || event.clientX > r.right || event.clientY < r.top || event.clientY > r.bottom) return;
    event.preventDefault(); event.stopPropagation();
    this.pointer = event.pointerId;
    this.previous = this.box;
    this.origin = this.point(event);
    this.stage.setPointerCapture(event.pointerId);
  }
  move(event) {
    if (this.pointer !== event.pointerId) return;
    event.preventDefault();
    const p = this.point(event), o = this.origin;
    this.box = [Math.floor(Math.min(p[0],o[0])), Math.floor(Math.min(p[1],o[1])),
                Math.ceil(Math.max(p[0],o[0])), Math.ceil(Math.max(p[1],o[1]))];
    this.draw();
  }
  finish(event) {
    if (this.pointer !== event.pointerId) return;
    this.move(event);
    const id = this.pointer;
    this.pointer = null;
    if (this.stage.hasPointerCapture(id)) this.stage.releasePointerCapture(id);
    if (!this.box || this.box[2]-this.box[0] < 2 || this.box[3]-this.box[1] < 2) {
      this.box = this.previous;
      this.draw();
      return;
    }
    this.onChange(this.box);
  }
  cancelDrag() {
    if (this.pointer === null) return;
    const id = this.pointer;
    this.pointer = null;
    if (this.stage.hasPointerCapture(id)) this.stage.releasePointerCapture(id);
    this.box = this.previous;
    this.draw();
  }
  draw() {
    const box = this.box, r = this.image.getBoundingClientRect(), s = this.stage.getBoundingClientRect();
    this.overlay.hidden = !box || !r.width || !this.image.naturalWidth;
    if (this.overlay.hidden) return;
    const sx = r.width / this.image.naturalWidth, sy = r.height / this.image.naturalHeight;
    Object.assign(this.overlay.style, {
      left: `${r.left-s.left+box[0]*sx}px`, top: `${r.top-s.top+box[1]*sy}px`,
      width: `${(box[2]-box[0])*sx}px`, height: `${(box[3]-box[1])*sy}px`,
    });
  }
}

const $ = (id) => document.getElementById(id);
let selectedFile = null;
let originalURL = null;
let busy = false;
let generation = 0;
let available = null;
let fullResult = null;
let currentResult = null;

function updateEngineInfo() {
  const engine = $('engine').value;
  let message = '离线基础版；AI 功能请启动 Python 后端使用。';
  if (engine === 'line') message = '先按阈值去灰、去背景，再平滑边缘。输出黑色或指定单色线条；浅线丢失时调高去灰阈值。';
  if (engine === 'local') message = '轻量超分辨率，原图最多 100 万像素；速度优先，目标 10 秒内完成。' + (available && !available.local ? ' 模型尚未安装。' : '');
  if (engine === 'doubao') message = '外部 API 无法保证 10 秒内完成，可能产生费用并改变字母或细线，请核对原图。' + (available && !available.doubao ? ' 后端尚未配置密钥或模型 ID。' : '');
  if (engine === 'desktop') message = '自动向已登录的 Windows 豆包 App 发送图片，右键复制生成结果。无需 API 密钥；运行时请勿操作键鼠，移到屏幕角落可停止。生成耗时不保证 10 秒，返回图保留原尺寸。' + (available && !available.desktop ? ' 请先完成本地校准并启用桌面模式。' : '');
  $('scale').disabled = engine === 'desktop';
  $('line-settings').hidden = engine !== 'line';
  document.querySelectorAll('[data-general-control]').forEach(control => {control.hidden = engine === 'line';});
  $('engine-info').textContent = message;
}


function status(message, error = false) {
  $('status').textContent = message;
  $('status').classList.toggle('error', error);
}
const sourceCrop = new RectangleSelection($('source-stage'), $('original'), $('source-selection'), box => {
  invalidateResult();
  $('source-crop-info').textContent = `仅处理选区 ${box[2]-box[0]} × ${box[3]-box[1]} px`;
  refreshCropControls();
  status('已选定处理区域，点击“处理图片”。');
});
const resultCrop = new RectangleSelection($('result-stage'), $('result'), $('result-selection'), box => {
  $('result-crop-info').textContent = `选区 ${box[2]-box[0]} × ${box[3]-box[1]} px`;
  refreshCropControls();
});
function refreshCropControls() {
  $('source-select').disabled = busy || !selectedFile || !$('original').naturalWidth;
  $('source-select').setAttribute('aria-pressed', String(sourceCrop.active));
  $('source-clear').disabled = busy || !sourceCrop.box;
  $('result-select').disabled = busy || !currentResult || !$('result').naturalWidth;
  $('result-select').setAttribute('aria-pressed', String(resultCrop.active));
  $('result-apply').disabled = busy || !currentResult || !resultCrop.box;
  $('result-clear').disabled = busy || !resultCrop.box;
  $('result-reset').disabled = busy || !fullResult || fullResult === currentResult;
}
function setBusy(value) {
  busy = value;
  if (busy) {sourceCrop.setActive(false); resultCrop.setActive(false);}
  $('process').disabled = busy || !selectedFile;
  refreshCropControls();
}
function showResult(result, name) {
  currentResult = result;
  resultCrop.clear();
  $('result-crop-info').textContent = '';
  $('result').src = result.image;
  $('result').hidden = false;
  $('result-stage').hidden = false;
  $('result-placeholder').hidden = true;
  $('result-info').textContent = result.caption;
  $('download').href = result.image;
  $('download').download = name;
  $('download').classList.remove('disabled');
  $('download').setAttribute('aria-disabled', 'false');
  refreshCropControls();
}
$('original').addEventListener('load', refreshCropControls);
$('result').addEventListener('load', refreshCropControls);
$('source-select').onclick = () => {
  sourceCrop.setActive(!sourceCrop.active);
  $('source-crop-info').textContent = sourceCrop.active ? '在图上拖拽框选，可重新框选。' : (sourceCrop.box ? '已保留处理选区。' : '');
  refreshCropControls();
};
$('source-clear').onclick = () => {
  sourceCrop.clear();
  $('source-crop-info').textContent = '';
  invalidateResult();
  status('已取消选区，将处理完整原图。');
};
$('result-select').onclick = () => {
  resultCrop.setActive(!resultCrop.active);
  $('result-crop-info').textContent = resultCrop.active ? '在图上拖拽框选，再点击“保留选区”。' : '';
  refreshCropControls();
};
$('result-clear').onclick = () => {resultCrop.clear(); $('result-crop-info').textContent = ''; refreshCropControls();};
$('result-reset').onclick = () => {
  if (!fullResult || busy) return;
  showResult(fullResult, $('download').download);
  status('已恢复本次处理的完整结果。');
};
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || busy) return;
  if (sourceCrop.active) $('source-clear').onclick();
  if (resultCrop.active) $('result-clear').onclick();
});
function invalidateResult() {
  generation++;
  fullResult = null;
  currentResult = null;
  resultCrop.clear();
  $('result-stage').hidden = true;
  $('result-crop-info').textContent = '';
  $('download').removeAttribute('href');
  $('download').classList.add('disabled');
  $('download').setAttribute('aria-disabled', 'true');
  $('result').hidden = true;
  $('result-placeholder').hidden = false;
  $('result-info').textContent = '处理完成后，可切换底色检查线条和透明边缘。';
  refreshCropControls();
}
function selectFile(file) {
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) return status('文件不能超过 20 MB。', true);
  if (!/^image\/(png|jpeg|webp|bmp|x-ms-bmp)$/.test(file.type)) return status('请使用 PNG、JPEG、WebP 或 BMP 图片。', true);
  if (originalURL) URL.revokeObjectURL(originalURL);
  selectedFile = file;
  sourceCrop.clear();
  $('source-crop-info').textContent = '';
  originalURL = URL.createObjectURL(file);
  $('original').src = originalURL;
  $('original').hidden = false;
  $('source-stage').hidden = false;
  $('placeholder').hidden = true;
  $('source-info').textContent = `${file.name || '粘贴的截图'} · ${(file.size / 1024).toFixed(0)} KB`;
  $('source-info').hidden = false;
  $('process').disabled = busy;
  invalidateResult();
  status('截图已就绪，点击“处理图片”。');
}
$('drop').onclick = () => {if (!sourceCrop.active) $('file').click();};
$('drop').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('file').onchange = (e) => { selectFile(e.target.files[0]); e.target.value = ''; };
document.addEventListener('paste', (e) => {
  const item = Array.from(e.clipboardData.items).find((item) => item.type.startsWith('image/'));
  if (item) { e.preventDefault(); selectFile(item.getAsFile()); }
});
for (const type of ['dragenter', 'dragover']) $('drop').addEventListener(type, (e) => {
  e.preventDefault(); $('drop').classList.add('dragover');
});
for (const type of ['dragleave', 'drop']) $('drop').addEventListener(type, (e) => {
  e.preventDefault(); $('drop').classList.remove('dragover');
  if (type === 'drop') selectFile(e.dataTransfer.files[0]);
});
for (const id of ['engine', 'line_threshold', 'line_smooth', 'line_ink', 'tolerance', 'sharpen', 'background', 'scale', 'padding', 'denoise']) {
  $(id).addEventListener('input', () => {
    if ($(id + '-value')) $(id + '-value').value = $(id).value;
    if (id === 'engine') updateEngineInfo();
    invalidateResult();
    if (selectedFile) status('参数已更新，请重新处理。');
  });
}
document.querySelectorAll('[data-bg]').forEach((button) => button.onclick = () => {
  $('result-preview').className = 'preview ' + button.dataset.bg;
  document.querySelectorAll('[data-bg]').forEach((other) => other.classList.toggle('active', other === button));
});
$('process').onclick = async () => {
  if (!selectedFile || busy) return;
  invalidateResult();
  const version = generation;
  const file = selectedFile;
  const data = new FormData();
  data.append('image', file, file.name || 'screenshot.png');
  for (const id of ['engine', 'line_threshold', 'line_smooth', 'line_ink', 'scale', 'tolerance', 'sharpen', 'padding', 'background']) data.append(id, $(id).value);
  data.append('denoise', $('denoise').checked);
  if (sourceCrop.box) data.append('crop', JSON.stringify(sourceCrop.box));
  setBusy(true);
  $('process').textContent = '正在处理…';
  status($('engine').value === 'desktop' ? '正在自动操作豆包 App，请勿操作键鼠；等待生成后会复制图片并去背景…' : '正在提高清晰度、去除背景并裁剪空白…');
  const controller = new AbortController();
  const engine = $('engine').value;
  const timeoutMs = engine === 'desktop' ? 300000 : engine === 'doubao' ? 180000 : 10000;
  const startedAt = performance.now();
  const timeout = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const result = await processLocalImage(data);
    if (version !== generation) return;
    result.caption = `${result.original.join(' × ')} → ${result.output.join(' × ')} px · PNG · ${((performance.now() - startedAt) / 1000).toFixed(2)} 秒`;
    fullResult = result;
    showResult(result, (file.name || 'screenshot').replace(/\.[^.]+$/, '') + '-clean.png');
    status(engine === 'line' ? '线稿净化完成。若浅色线条缺失，请调高去灰阈值；边缘太软时调低平滑。' : '处理完成。若细线缺失，请降低去背景容差。');
  } catch (error) {
    if (version === generation) status(error.name === 'AbortError' ? (timeoutMs === 10000 ? '本次处理超过 10 秒，请缩小截图或选择基础增强。' : engine === 'desktop' ? '豆包 App 自动化等待超时，请检查客户端。不要直接重试，以免重复发送。' : '豆包 API 超时，请稍后重试。') : error.message, true);
  } finally {
    clearTimeout(timeout);
    setBusy(false);
    $('process').innerHTML = '处理图片 <span>→</span>';
  }
};
$('result-apply').onclick = async () => {
  if (busy || !currentResult || !resultCrop.box) return;
  const version = generation;
  const data = new FormData();
  const image = currentResult.image;
  const box = [...resultCrop.box];
  setBusy(true);
  status('正在保留选区…');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const blob = await (await fetch(image)).blob();
    data.append('image', blob, 'result.png');
    data.append('crop', JSON.stringify(box));
    const result = await cropLocalImage(blob, box);
    if (version !== generation) return;
    result.caption = `${result.output.join(' × ')} px · PNG · 已保留选区`;
    showResult(result, $('download').download);
    status('已保留选区，下载按钮将保存裁剪后的 PNG。');
  } catch (error) {
    if (version === generation) status(error.name === 'AbortError' ? '裁剪超时，请稍后重试。' : error.message, true);
  } finally {
    clearTimeout(timeout);
    setBusy(false);
  }
};
</script>
</body>
</html>
